name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Renovate branch automerge pushes renovate/* branches without a PR.
      # Renovate only merges a branch once its checks pass, so CI must run there.
      - "renovate/**"

permissions:
  contents: read

jobs:
  checks:
    name: Basic checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Run tests
        run: bun run test
